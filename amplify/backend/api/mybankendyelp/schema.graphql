# Allow public read access and authenticated users to create/edit their own businesses and reviews
input AMPLIFY { globalAuthRule: AuthRule = { allow: public } } # FOR TESTING ONLY!

type Business @model @auth(rules: [
  { allow: owner }, 
  { allow: public, operations: [read] }, # Everyone can read
  { allow: groups, groups: ["Admin"], operations: [create, update, delete] } # Optional: Admins can manage businesses
]) {
  id: ID!
  name: String!
  description: String
  address: String!
  phone: String
  category: String
  owner: String
}

type Review @model @auth(rules: [
  { allow: owner }, 
  { allow: public, operations: [read] }, # Everyone can read
  { allow: groups, groups: ["Admin"], operations: [create, update, delete] } # Optional: Admins can manage reviews
]) {
  id: ID!
  businessID: ID! @index(name: "byBusiness")
  rating: Int!
  comment: String
  owner: String
}
